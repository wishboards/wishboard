services:
  db:
    # Pinned (not :latest) for reproducible, offline-safe deploys.
    # Bumps come via Dependabot (docker-compose) as PRs.
    # Changing this minor/major may require recreating the ./data/db directory.
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    container_name: wishboard-db
    volumes:
      - ./data/db:/var/lib/sqld
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      - RUST_LOG=info

  wishboard:
    image: ghcr.io/wishboards/wishboard:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wishboard
    depends_on:
      - db
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=http://db:8080
      # Public domain + AP IP for the poster/Wi-Fi popup, resolved at runtime via
      # /api/config. Substituted from the .env that build-kiosk.sh writes (empty in
      # a bare `docker compose up`, which is fine — the client falls back to the host).
      - WISHBOARD_DOMAIN=${WISHBOARD_DOMAIN:-}
      - WISHBOARD_AP_IP=${WISHBOARD_AP_IP:-}
      - EVENT_PROFILE=${EVENT_PROFILE:-lifestyle}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - AI_PROVIDER=${AI_PROVIDER:-noop}
      - AI_MODEL=${AI_MODEL:-}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_ENDPOINT=${AI_API_ENDPOINT:-}
      - WISHBOARD_ADMIN_USERNAME=${WISHBOARD_ADMIN_USERNAME:-}
      - WISHBOARD_ADMIN_SECRET=${WISHBOARD_ADMIN_SECRET:-}
