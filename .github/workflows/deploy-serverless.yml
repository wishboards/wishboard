name: Deploy Serverless

on:
  workflow_dispatch:
    inputs:
      event_profile:
        description: 'Event profile taxonomy (lifestyle or professional)'
        required: true
        default: 'lifestyle'
        type: choice
        options:
          - lifestyle
          - professional
      mode:
        description: 'Deployment mode (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      domain_name:
        description: 'Custom domain name (e.g. demo.wishboards.app)'
        required: false
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: false
        type: string
      database_url:
        description: 'Turso Database URL'
        required: false
        type: string
      database_auth_token_ssm:
        description: 'Turso Auth Token SSM Parameter Name'
        required: false
        type: string
      certificate_domain_name:
        description: 'Certificate Domain Name (e.g. wishboards.app for primary wildcard cert)'
        required: false
        type: string
      acm_certificate_arn:
        description: 'Existing ACM Certificate ARN'
        required: false
        type: string
      enable_ai_features:
        description: 'Enable AI features (true or false)'
        required: false
        default: 'false'
        type: string
      ai_provider:
        description: 'AI provider (noop, local, or cloud)'
        required: false
        default: 'noop'
        type: string
      ai_api_key_ssm:
        description: 'SSM parameter path for AI API key (e.g. /wishboard/ai/gemini-api-key)'
        required: false
        type: string
      ai_model:
        description: 'AI model name (e.g. gemini-flash-latest)'
        required: false
        default: 'gemini-flash-latest'
        type: string
  workflow_call:
    inputs:
      event_profile:
        description: 'Event profile taxonomy (lifestyle or professional)'
        required: false
        default: 'lifestyle'
        type: string
      mode:
        description: 'Deployment mode (dev or prod)'
        required: false
        default: 'dev'
        type: string
      domain_name:
        description: 'Custom domain name'
        required: false
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: false
        type: string
      database_url:
        description: 'Turso Database URL'
        required: false
        type: string
      database_auth_token_ssm:
        description: 'Turso Auth Token SSM Parameter Name'
        required: false
        type: string
      certificate_domain_name:
        description: 'Certificate Domain Name'
        required: false
        type: string
      acm_certificate_arn:
        description: 'ACM Certificate ARN'
        required: false
        type: string
      enable_ai_features:
        description: 'Enable AI features (true or false)'
        required: false
        default: 'false'
        type: string
      ai_provider:
        description: 'AI provider (noop, local, or cloud)'
        required: false
        default: 'noop'
        type: string
      ai_api_key_ssm:
        description: 'SSM parameter path for AI API key'
        required: false
        type: string
      ai_model:
        description: 'AI model name'
        required: false
        default: 'gemini-flash-latest'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Serverless (${{ inputs.event_profile || github.event.inputs.event_profile || 'lifestyle' }})
    runs-on: ubuntu-latest

    env:
      DOMAIN_NAME: ${{ inputs.domain_name || github.event.inputs.domain_name }}
      DATABASE_URL: ${{ inputs.database_url }}
      DATABASE_AUTH_TOKEN_SSM: ${{ inputs.database_auth_token_ssm }}
      CERTIFICATE_DOMAIN_NAME: ${{ inputs.certificate_domain_name }}
      ACM_CERTIFICATE_ARN: ${{ inputs.acm_certificate_arn }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      ENABLE_AI_FEATURES: ${{ inputs.enable_ai_features || github.event.inputs.enable_ai_features }}
      AI_PROVIDER: ${{ inputs.ai_provider || github.event.inputs.ai_provider }}
      AI_API_KEY_SSM: ${{ inputs.ai_api_key_ssm || github.event.inputs.ai_api_key_ssm }}
      AI_MODEL: ${{ inputs.ai_model || github.event.inputs.ai_model }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Deploy serverless stack
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          MODE="${{ inputs.mode || github.event.inputs.mode || '' }}"
          EVENT_PROF="${{ inputs.event_profile || github.event.inputs.event_profile || 'lifestyle' }}"
          STACK_NAME="${{ inputs.stack_name || github.event.inputs.stack_name || '' }}"
          DOMAIN_NAME="${{ inputs.domain_name || github.event.inputs.domain_name || '' }}"
          DATABASE_URL="${{ inputs.database_url || '' }}"
          DATABASE_AUTH_TOKEN_SSM="${{ inputs.database_auth_token_ssm || '' }}"
          CERTIFICATE_DOMAIN_NAME="${{ inputs.certificate_domain_name || '' }}"
          ACM_CERTIFICATE_ARN="${{ inputs.acm_certificate_arn || '' }}"
          ENABLE_AI_FEATURES="${{ inputs.enable_ai_features || github.event.inputs.enable_ai_features || '' }}"
          AI_PROVIDER="${{ inputs.ai_provider || github.event.inputs.ai_provider || '' }}"
          AI_API_KEY_SSM="${{ inputs.ai_api_key_ssm || github.event.inputs.ai_api_key_ssm || '' }}"
          AI_MODEL="${{ inputs.ai_model || github.event.inputs.ai_model || '' }}"

          PREFIX=$(echo "$EVENT_PROF" | tr '[:lower:]' '[:upper:]')

          get_var() {
            local key="$1" explicit="$2" fallback="$3"
            if [ -n "$explicit" ]; then
              echo "$explicit"
            else
              local val
              val=$(echo "$VARS_JSON" | jq -r --arg k "${PREFIX}_${key}" '.[$k] // empty')
              if [ -n "$val" ]; then
                echo "$val"
              else
                echo "$fallback"
              fi
            fi
          }

          export STACK_NAME=$(get_var "AWS_STACK_NAME" "$STACK_NAME" "")
          export DOMAIN_NAME=$(get_var "DOMAIN_NAME" "$DOMAIN_NAME" "")
          export DATABASE_URL=$(get_var "DATABASE_URL" "$DATABASE_URL" "")
          export DATABASE_AUTH_TOKEN_SSM=$(get_var "DATABASE_AUTH_TOKEN_SSM" "$DATABASE_AUTH_TOKEN_SSM" "")
          export CERTIFICATE_DOMAIN_NAME=$(get_var "CERTIFICATE_DOMAIN_NAME" "$CERTIFICATE_DOMAIN_NAME" "")
          export ACM_CERTIFICATE_ARN=$(get_var "ACM_CERTIFICATE_ARN" "$ACM_CERTIFICATE_ARN" "")
          export ENABLE_AI_FEATURES=$(get_var "ENABLE_AI_FEATURES" "$ENABLE_AI_FEATURES" "false")
          export AI_PROVIDER=$(get_var "AI_PROVIDER" "$AI_PROVIDER" "noop")
          export AI_API_KEY_SSM=$(get_var "AI_API_KEY_SSM" "$AI_API_KEY_SSM" "")
          export AI_MODEL=$(get_var "AI_MODEL" "$AI_MODEL" "gemini-flash-latest")
          MODE=$(get_var "MODE" "$MODE" "dev")

          CMD="node src/cli/wishboard.js serverless deploy --mode $MODE --event-profile $EVENT_PROF"
          if [ -n "$STACK_NAME" ]; then
            CMD="$CMD --stack-name $STACK_NAME"
          fi
          if [ "$ENABLE_AI_FEATURES" = "true" ]; then
            CMD="$CMD --enable-ai"
          fi
          if [ -n "$AI_PROVIDER" ]; then
            CMD="$CMD --ai-provider $AI_PROVIDER"
          fi
          if [ -n "$AI_API_KEY_SSM" ]; then
            CMD="$CMD --ai-api-key-ssm $AI_API_KEY_SSM"
          fi
          if [ -n "$AI_MODEL" ]; then
            CMD="$CMD --ai-model $AI_MODEL"
          fi

          eval $CMD
