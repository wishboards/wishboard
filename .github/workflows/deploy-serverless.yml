name: Deploy Serverless

on:
  workflow_dispatch:
    inputs:
      event_profile:
        description: 'Event profile taxonomy (lifestyle or professional)'
        required: true
        default: 'lifestyle'
        type: choice
        options:
          - lifestyle
          - professional
      mode:
        description: 'Deployment mode (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      domain_name:
        description: 'Custom domain name (e.g. demo.wishboards.app)'
        required: false
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: false
        type: string
      database_url:
        description: 'Turso Database URL'
        required: false
        type: string
      database_auth_token_ssm:
        description: 'Turso Auth Token SSM Parameter Name'
        required: false
        type: string
      certificate_domain_name:
        description: 'Certificate Domain Name (e.g. wishboards.app for primary wildcard cert)'
        required: false
        type: string
      acm_certificate_arn:
        description: 'Existing ACM Certificate ARN'
        required: false
        type: string
  workflow_call:
    inputs:
      event_profile:
        description: 'Event profile taxonomy (lifestyle or professional)'
        required: false
        default: 'lifestyle'
        type: string
      mode:
        description: 'Deployment mode (dev or prod)'
        required: false
        default: 'dev'
        type: string
      domain_name:
        description: 'Custom domain name'
        required: false
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: false
        type: string
      database_url:
        description: 'Turso Database URL'
        required: false
        type: string
      database_auth_token_ssm:
        description: 'Turso Auth Token SSM Parameter Name'
        required: false
        type: string
      certificate_domain_name:
        description: 'Certificate Domain Name'
        required: false
        type: string
      acm_certificate_arn:
        description: 'ACM Certificate ARN'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Serverless (${{ inputs.event_profile || github.event.inputs.event_profile || 'lifestyle' }})
    runs-on: ubuntu-latest

    env:
      DOMAIN_NAME: ${{ inputs.domain_name || github.event.inputs.domain_name }}
      DATABASE_URL: ${{ inputs.database_url }}
      DATABASE_AUTH_TOKEN_SSM: ${{ inputs.database_auth_token_ssm }}
      CERTIFICATE_DOMAIN_NAME: ${{ inputs.certificate_domain_name }}
      ACM_CERTIFICATE_ARN: ${{ inputs.acm_certificate_arn }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Deploy serverless stack
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          MODE="${{ inputs.mode || github.event.inputs.mode || '' }}"
          EVENT_PROF="${{ inputs.event_profile || github.event.inputs.event_profile || 'lifestyle' }}"
          STACK_NAME="${{ inputs.stack_name || github.event.inputs.stack_name || '' }}"
          DOMAIN_NAME="${{ inputs.domain_name || github.event.inputs.domain_name || '' }}"
          DATABASE_URL="${{ inputs.database_url || '' }}"
          DATABASE_AUTH_TOKEN_SSM="${{ inputs.database_auth_token_ssm || '' }}"
          CERTIFICATE_DOMAIN_NAME="${{ inputs.certificate_domain_name || '' }}"
          ACM_CERTIFICATE_ARN="${{ inputs.acm_certificate_arn || '' }}"

          PREFIX=$(echo "$EVENT_PROF" | tr '[:lower:]' '[:upper:]')

          get_var() {
            local key="$1" explicit="$2" fallback="$3"
            if [ -n "$explicit" ]; then
              echo "$explicit"
            else
              local val
              val=$(echo "$VARS_JSON" | jq -r --arg k "${PREFIX}_${key}" '.[$k] // empty')
              if [ -n "$val" ]; then
                echo "$val"
              else
                echo "$fallback"
              fi
            fi
          }

          export STACK_NAME=$(get_var "AWS_STACK_NAME" "$STACK_NAME" "")
          export DOMAIN_NAME=$(get_var "DOMAIN_NAME" "$DOMAIN_NAME" "")
          export DATABASE_URL=$(get_var "DATABASE_URL" "$DATABASE_URL" "")
          export DATABASE_AUTH_TOKEN_SSM=$(get_var "DATABASE_AUTH_TOKEN_SSM" "$DATABASE_AUTH_TOKEN_SSM" "")
          export CERTIFICATE_DOMAIN_NAME=$(get_var "CERTIFICATE_DOMAIN_NAME" "$CERTIFICATE_DOMAIN_NAME" "")
          export ACM_CERTIFICATE_ARN=$(get_var "ACM_CERTIFICATE_ARN" "$ACM_CERTIFICATE_ARN" "")
          MODE=$(get_var "MODE" "$MODE" "dev")

          CMD="node src/cli/wishboard.js serverless deploy --mode $MODE --event-profile $EVENT_PROF"
          if [ -n "$STACK_NAME" ]; then
            CMD="$CMD --stack-name $STACK_NAME"
          fi

          eval $CMD
