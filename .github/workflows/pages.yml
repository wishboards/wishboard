name: GitHub Pages (Docs & Stryker)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# Set permissions at workflow level
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24' # Use the project's supported node version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Application
        run: npm run build

      - name: Build Starlight Docs
        run: |
          cd docs
          npm ci --ignore-scripts
          npm run build
          cd ..

      - name: Run Stryker Mutation Tests
        run: npx --no-install stryker run --concurrency 2
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          STRYKER_DASHBOARD_PROJECT: github.com/${{ github.repository }}
        continue-on-error: true # Keep deploying the report even if mutants survive and the process exits with an error code

      - name: Generate Mutation Summary
        if: always()
        run: node scripts/generate-mutation-summary.js

      - name: Merge Reports into Docs
        if: always()
        run: |
          mkdir -p docs/dist/mutation
          cp -r reports/mutation/* docs/dist/mutation/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/dist' # The directory containing the Starlight site and mutation report

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
