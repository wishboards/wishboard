name: Watch upstream peers (TS 7, JSDOM)

# We pin typescript to 6.0.x (typescript-eslint peers TS <6.1.0) and monitor jsdom
# for native WebStorage support on Node 25+ (tracked in #531).
# This weekly job checks whether those upstream blockers have resolved and comments
# on the respective tracking issues (#492 and #531) once.

on:
  schedule:
    - cron: '17 13 * * 1' # weekly, Mondays 13:17 UTC
  workflow_dispatch: # allow a manual check

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether upstream peers unblock our pins
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Does <version> satisfy <pkg>@latest's peer range for <peer-key>?
          # Echoes "yes|<range>", "no|<range>", or "unknown".
          satisfies() {
            local pkg="$1" key="$2" version="$3" range
            range=$(npm view "$pkg@latest" "peerDependencies.$key" 2>/dev/null || true)
            if [ -z "$range" ]; then echo "unknown"; return; fi
            if npx --yes semver -r "$range" "$version" >/dev/null 2>&1; then
              echo "yes|$range"
            else
              echo "no|$range"
            fi
          }

          # Comment on the tracking issue once per condition (marker-guarded).
          notify() {
            local issue="$1" marker="$2" body="$3"
            if gh issue view "$issue" --repo "$REPO" --json comments \
                 --jq '.comments[].body' 2>/dev/null | grep -qF "$marker"; then
              echo "Already notified on #$issue for $marker."
              return
            fi
            printf '%s\n%b\n\n_Auto-detected by the weekly upstream-peer watcher._' \
              "$marker" "$body" | gh issue comment "$issue" --repo "$REPO" --body-file -
          }

          tse=$(satisfies typescript-eslint typescript 7.0.0)
          echo "typescript-eslint vs typescript@7 -> $tse"
          case "$tse" in
            yes*) notify '492' '<!-- watch:typescript-eslint-ts7 -->' \
              "✅ **typescript-eslint** now allows \`typescript@7\` (peer: \`${tse#yes|}\`). The TypeScript 7 bump (#176) is unblocked." ;;
          esac

          jsdom_ver=$(npm view "jsdom@latest" version 2>/dev/null || true)
          echo "jsdom latest -> $jsdom_ver"
          if [ -n "$jsdom_ver" ] && npx --yes semver -r ">30.1.3" "$jsdom_ver" >/dev/null 2>&1; then
            notify '531' '<!-- watch:jsdom-webstorage -->' \
              "✅ **jsdom** has published \`v$jsdom_ver\` (>30.1.3). Check release notes to see if Node 25+ uninitialized globalThis.localStorage is supported so the WebStorage polyfill can be retired (#531)."
          fi

          echo "Done."
