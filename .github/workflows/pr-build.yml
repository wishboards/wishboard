name: Build PR Image

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Cancel an in-progress image build when the same PR is pushed again.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-pr-docker:
    # Ignore PRs from release-please since it just bumps versions
    if: ${{ !startsWith(github.head_ref, 'release-please-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test PR Docker image imports and sticker assets
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}"
          docker pull "$IMAGE"
          docker run --rm --entrypoint node "$IMAGE" -e "
            import { existsSync } from 'node:fs';
            if (!existsSync('/app/dist/assets/stickers/nonbinary.svg')) {
              throw new Error('Missing bundled sticker asset /app/dist/assets/stickers/nonbinary.svg');
            }
            await import('./src/server/configManager.js');
            await import('./src/server/routes/admin.js');
            await import('./src/server/proposalsManager.js');
            await import('./src/server/taxonomyExporter.js');
            console.log('Docker runtime smoke check passed');
          "
          docker run --rm --entrypoint node "$IMAGE" src/cli/wishboard.js --help >/dev/null
