name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build_tag:
        description: 'Force Docker build & publish for tag (e.g. wishboard-v1.33.1)'
        required: false
        default: ''

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # In manifest mode with root '.' and subpath 'api', release-please-action (src/index.ts) sets:
    #   - 'release_created' & 'tag_name' for root path '.' (the Wishboard application)
    #   - 'api--release_created' & 'api--tag_name' for subpath 'api' (the OpenAPI contract)
    #   - 'releases_created' (plural) if ANY package released
    # Gating downstream jobs on 'release_created' guarantees Docker and serverless
    # deployments run ONLY for Wishboard app releases, never for API-only releases (ADR 0010).
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}

  build-and-publish-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (inputs.force_build_tag != null && inputs.force_build_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.force_build_tag || needs.release-please.outputs.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize tag name
        id: sanitize
        run: |
          RAW_TAG="${{ inputs.force_build_tag || needs.release-please.outputs.tag_name }}"
          CLEAN_TAG="${RAW_TAG#wishboard-}"
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.sanitize.outputs.clean_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.sanitize.outputs.clean_tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-serverless:
    name: Deploy Serverless (${{ matrix.profile }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (inputs.force_build_tag != null && inputs.force_build_tag != '') }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(vars.SERVERLESS_PROFILES || '["lifestyle", "professional"]') }}
    uses: ./.github/workflows/deploy-serverless.yml
    with:
      event_profile: ${{ matrix.profile }}
    secrets: inherit
